<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f4" />
    <title>WoZ 實驗系統</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #20221f;
        --muted: #777b73;
        --line: #e6e7e1;
        --soft: #f7f7f4;
        --white: #fff;
        --blue: #425d4a;
        --blue-light: #e9efe9;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      }
      * { box-sizing: border-box; }
      body { display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 24px; color: var(--ink); background: var(--soft); }
      main { width: min(720px, 100%); }
      h1 { margin: 0 0 6px; font-size: 1.6rem; }
      .lede { margin: 0 0 28px; color: var(--muted); }
      .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
      .link-card {
        display: grid;
        gap: 6px;
        padding: 24px;
        color: inherit;
        text-decoration: none;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--white);
        box-shadow: 0 6px 20px rgba(34, 40, 30, .06);
        transition: transform .15s ease, border-color .15s ease;
      }
      .link-card:hover { border-color: var(--blue); transform: translateY(-3px); }
      .link-icon { font-size: 1.8rem; line-height: 1; }
      .link-title { font-size: 1.2rem; font-weight: 750; }
      .link-desc { color: var(--muted); font-size: .92rem; line-height: 1.5; }
      .hint { margin-top: 28px; padding: 16px 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--blue-light); color: var(--blue); font-size: .92rem; line-height: 1.7; }
      .hint strong { display: block; margin-bottom: 4px; }
      code { padding: 2px 6px; border-radius: 5px; background: rgba(255, 255, 255, .7); }
    </style>
  </head>
  <body>
    <main>
      <h1>WoZ 實驗系統</h1>
      <p class="lede">在這台電腦開參與者畫面，在自己的視窗開控制台；兩邊即時同步。</p>

      <div class="links">
        <a class="link-card" href="/client/">
          <span class="link-icon" aria-hidden="true">🍳</span>
          <span class="link-title">參與者畫面</span>
          <span class="link-desc">給參與者看的食譜頁。放到外接螢幕後按「全螢幕」。</span>
        </a>
        <a class="link-card" href="/wizard/">
          <span class="link-icon" aria-hidden="true">🎛️</span>
          <span class="link-title">Wizard 控制台</span>
          <span class="link-desc">切換頁面、勾選步驟、調整點數與回溯。</span>
        </a>
      </div>

      <p class="hint">
        <strong>要用兩台電腦時</strong>
        另一台連 server 啟動時印出的區網網址（例如 <code>http://192.168.0.12:8000/client/</code>），兩台必須在同一個區域網路下。
      </p>
    </main>
  </body>
</html>
